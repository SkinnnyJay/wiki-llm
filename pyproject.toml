[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "0.3.0"
description = "llm-wiki vault CLI and MCP Python modules (plugin assets require git clone or marketplace install)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
llm-wiki = "llm_wiki_cli:main"

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["llm_wiki", "llm_wiki_cli", "mcp_server", "mcp_sse"]

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["cli*", "ingest*", "lib*", "mcp*"]

[tool.basedpyright]
include = ["scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportAny = "warning"
reportExplicitAny = "none"
# Optional adapters (playwright, chromadb, youtube_transcript_api) are not required for core CLI.
reportMissingImports = "warning"
