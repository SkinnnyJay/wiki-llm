[pytest]
python_files = *.test.py test_*.py *_test.py
testpaths = tests
addopts = --import-mode=importlib
markers =
    network: uses the network (RUN_NETWORK_TESTS=1)
    claude: requires claude CLI (RUN_CLAUDE_TESTS=1)
    codex_skill_eval: optional Codex skill mirror (RUN_CODEX_SKILL_EVALS=1)
    replay: golden CLI replay fixtures (tests/fixtures/golden/*.json)
    browser: Playwright viewer smoke (RUN_BROWSER_TESTS=1)
filterwarnings =
    ignore::DeprecationWarning
