<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Wiki graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <link rel="stylesheet" href="graph-styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <img class="logo-mark" src="logo.png" alt="LLM Wiki" width="28" height="28" decoding="async" />
        <span class="brand" id="graph-title">Wiki graph</span>
      </div>
      <div class="header-meta" id="graph-meta"></div>
      <span class="persona-badge" id="persona-name">Gennie</span>
    </header>

    <div class="app-body">
      <aside class="sidebar-legend hidden" id="legend">
        <div class="legend-title">Clusters</div>
        <div id="legend-items"></div>
      </aside>

      <div class="graph-pane">
        <svg id="graph-svg"></svg>
        <div class="graph-sub" id="graph-sub"></div>
        <div class="tooltip hidden" id="tooltip"></div>
      </div>

      <aside class="sidebar-detail">
        <div class="detail-title">Selected</div>
        <div class="detail-empty" id="detail">Click a node.</div>
      </aside>
    </div>
  </div>
  <script src="graph-app.js"></script>
</body>
</html>
