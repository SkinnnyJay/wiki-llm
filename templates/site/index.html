<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Wiki</title>
  <meta property="og:title" content="LLM Wiki" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Interactive knowledge graph and wiki reader" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@17/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <svg class="logo-mark" viewBox="0 0 36 36" fill="none">
          <path d="M14 9C19 7 24 9 24.5 16" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M10 18C15 19 20 19 24.5 16" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none"/>
          <path d="M13 27C18 27 23 23 24.5 16" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" fill="none"/>
          <circle cx="14" cy="9" r="3.5" fill="#7dd3fc"/>
          <circle cx="10" cy="18" r="3.5" fill="#7dd3fc"/>
          <circle cx="13" cy="27" r="3.5" fill="#7dd3fc"/>
          <circle cx="24.5" cy="16" r="5" fill="#a78bfa"/>
        </svg>
        <span class="brand">LLM Wiki</span>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="5.5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search wiki…" autocomplete="off" />
          <span class="search-kbd">⌘K</span>
        </div>
      </div>
      <div class="header-right">
        <span class="persona-badge" id="persona-name">Gennie</span>
        <button class="icon-btn" id="toggle-sidebar" title="Toggle sidebar">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="1" y="1" width="14" height="14" rx="2"/><line x1="5.5" y1="1" x2="5.5" y2="15"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head"><span class="sidebar-label">Pages</span></div>
        <div class="tree" id="file-tree"></div>
      </aside>

      <div class="graph-pane" id="graph-pane">
        <svg id="graph-svg"></svg>
        <div class="graph-stats" id="graph-stats"></div>
      </div>

      <div class="reader-pane" id="reader-pane">
        <div class="reader-empty" id="reader-empty">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="8" y="6" width="32" height="36" rx="4"/>
            <line x1="16" y1="16" x2="32" y2="16"/><line x1="16" y1="22" x2="28" y2="22"/>
            <line x1="16" y1="28" x2="30" y2="28"/><line x1="16" y1="34" x2="24" y2="34"/>
          </svg>
          <p>Select a node to explore</p>
        </div>
        <div class="reader-scroll" id="reader-scroll" style="display:none">
          <div class="reader-header" id="reader-header"></div>
          <div class="reader-body" id="reader-body"></div>
          <div class="linked-section" id="linked-section"></div>
        </div>
      </div>
    </div>

    <div class="app-ledger" id="app-ledger"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
