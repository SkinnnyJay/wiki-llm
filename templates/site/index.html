<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LLM Wiki</title>
  <meta property="og:title" content="LLM Wiki" />
  <meta property="og:type" content="website" />
  <meta property="og:description" content="Interactive knowledge graph and wiki reader" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-left">
        <img class="logo-mark" src="logo-mark.svg" alt="LLM Wiki" width="34" height="34" decoding="async" />
        <span class="brand">LLM Wiki</span>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="5.5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/>
          </svg>
          <input type="text" id="search-input" placeholder="Global search" autocomplete="off" />
          <span class="search-kbd">⌘K</span>
        </div>
      </div>
      <div class="header-right">
        <span class="persona-badge" id="persona-name">Gennie</span>
        <button class="icon-btn" id="toggle-sidebar" title="Settings">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M2.9 13.1l1.4-1.4M11.7 4.3l1.4-1.4"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-head"><span class="sidebar-label">Folders</span></div>
        <div class="tree" id="file-tree"></div>
      </aside>

      <div class="graph-pane" id="graph-pane">
        <svg id="graph-svg"></svg>
        <div class="graph-stats" id="graph-stats"></div>
      </div>

      <div class="reader-pane" id="reader-pane">
        <div class="reader-empty" id="reader-empty">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="8" y="6" width="32" height="36" rx="4"/>
            <line x1="16" y1="16" x2="32" y2="16"/><line x1="16" y1="22" x2="28" y2="22"/>
            <line x1="16" y1="28" x2="30" y2="28"/><line x1="16" y1="34" x2="24" y2="34"/>
          </svg>
          <p>Select a node to explore</p>
        </div>
        <div class="reader-scroll" id="reader-scroll" style="display:none">
          <button class="reader-overflow" id="reader-overflow" title="More options">
            <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="3" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
          </button>
          <div class="reader-header" id="reader-header"></div>
          <div class="reader-body" id="reader-body"></div>
          <div class="linked-section" id="linked-section"></div>
        </div>
      </div>
    </div>

    <div class="app-ledger" id="app-ledger"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
