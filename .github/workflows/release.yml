# Optional: verify tests when a version tag is pushed (manual marketplace steps still required).
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Plugin repo checks
        run: python scripts/llm_wiki.py check --plugin-repo
      - name: Pytest
        run: python -m pytest tests/
        env:
          PYTHONPATH: scripts
