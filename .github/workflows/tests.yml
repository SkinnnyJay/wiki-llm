name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Plugin repo checks (agent docs + compileall)
        run: python scripts/llm_wiki.py check --plugin-repo
      - name: Run pytest
        run: python -m pytest tests/
        env:
          PYTHONPATH: scripts

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps + Playwright
        run: |
          pip install -r requirements-dev.txt
          pip install playwright
          playwright install chromium
      - name: Run browser-marked tests
        run: python -m pytest tests/test_viewer_playwright.py -v
        env:
          PYTHONPATH: scripts
          RUN_BROWSER_TESTS: "1"
