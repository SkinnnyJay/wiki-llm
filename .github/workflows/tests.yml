name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pypi-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and install in an empty virtual environment
        run: |
          python -m venv /tmp/llm-wiki-build
          /tmp/llm-wiki-build/bin/python -m pip install -U pip build
          /tmp/llm-wiki-build/bin/python -m build -o /tmp/llm-wiki-dist
          python -m venv /tmp/llm-wiki-install
          /tmp/llm-wiki-install/bin/python -m pip install /tmp/llm-wiki-dist/*.whl
          /tmp/llm-wiki-install/bin/llm-wiki --version

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Plugin repo checks (agent docs + compileall)
        run: python scripts/llm_wiki.py check --plugin-repo
      - name: Run pytest
        run: python -m pytest tests/
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts

  web-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev deps + Playwright
        run: |
          pip install -r requirements-dev.txt
          pip install playwright
          playwright install chromium
      - name: Run browser-marked tests
        run: python -m pytest tests/test_viewer_playwright.py -v
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          RUN_BROWSER_TESTS: "1"
